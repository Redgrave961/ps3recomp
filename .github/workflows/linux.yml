name: Linux

on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Linux x64 (${{ matrix.compiler }}, ${{ matrix.build_type }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Debug, Release]
    env:
      CC: ${{ matrix.compiler == 'clang' && 'clang' || 'gcc' }}
      CXX: ${{ matrix.compiler == 'clang' && 'clang++' || 'g++' }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang
          "$VCPKG_INSTALLATION_ROOT/vcpkg" install sdl3 vulkan-headers volk vulkan-memory-allocator --triplet x64-linux

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_PREFIX_PATH="$VCPKG_INSTALLATION_ROOT/installed/x64-linux"

      - name: Build
        run: cmake --build build

      - name: Verify the archive exists and is x86-64
        run: |
          test -f build/libps3recomp_runtime.a
          file build/libps3recomp_runtime.a
          nm --undefined-only build/libps3recomp_runtime.a \
            | awk '{print $2}' | sort -u > /tmp/undef.txt
          if grep -qE '^(pthread_threadid_np|QueryPerformance|GetTickCount64)' /tmp/undef.txt; then
            echo "Win32/Darwin-only symbol left undefined in a POSIX build:"
            grep -E '^(pthread_threadid_np|QueryPerformance|GetTickCount64)' /tmp/undef.txt
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Run the lifter test suites
        env:
          CI: "1"
        run: |
          set -e
          for t in tools/test_*.py; do
            echo "--- $t"
            python "$t"
          done

      - name: Check the PPU boot scaffold (ratchet)
        run: python tools/check_ppu_scaffold.py

      - name: Run the ps3_env_once test
        run: |
          $CC -std=gnu17 -Wall -Werror -I include -o /tmp/test_env_once tests/test_env_once.c
          /tmp/test_env_once
          $CXX -x c++ -std=c++17 -Wall -Werror -I include -o /tmp/test_env_once_cpp tests/test_env_once.c
          /tmp/test_env_once_cpp

      - name: Run self-contained SPU helper tests
        run: |
          $CC -std=gnu17 -I include -I runtime/spu -o /tmp/test_spu_helpers runtime/spu/tests/test_spu_helpers.c -lm
          /tmp/test_spu_helpers

      - name: Run the SPU float and integer helper tests
        run: |
          for t in test_spu_float_vector_scalar test_spu_float_exact; do
            $CC -std=gnu17 -O2 -msse4.1 -ffp-contract=off -UNDEBUG -I include -I runtime/spu \
              -o /tmp/${t}_sse41 runtime/spu/tests/$t.c -lm
          done
          /tmp/test_spu_float_vector_scalar_sse41 4
          /tmp/test_spu_float_exact_sse41
          $CC -std=gnu17 -O2 -msse4.1 -I include -I runtime -I runtime/spu \
            -o /tmp/test_spu_int_x86_sse41 runtime/spu/tests/test_spu_int_x86.c -lm
          /tmp/test_spu_int_x86_sse41
          if grep -q avx2 /proc/cpuinfo; then
            $CC -std=gnu17 -O2 -mavx2 -mfma -I include -I runtime/spu \
              -o /tmp/test_spu_float_neon runtime/spu/tests/test_spu_float_neon.c -lm
            /tmp/test_spu_float_neon
            $CC -std=gnu17 -O2 -mavx2 -mfma -I include -I runtime -I runtime/spu \
              -o /tmp/test_spu_int_x86_avx2 runtime/spu/tests/test_spu_int_x86.c -lm
            /tmp/test_spu_int_x86_avx2
            $CC -std=gnu17 -O2 -mavx2 -mfma -I include -I runtime/spu \
              -o /tmp/test_spu_float_est runtime/spu/tests/test_spu_float_est.c -lm
            /tmp/test_spu_float_est
          fi

      - name: Run the sys_net loopback test
        run: |
          $CC -std=gnu17 -I include -o /tmp/test_sys_net libs/network/tests/test_sys_net.c
          /tmp/test_sys_net

      - name: Run self-contained RSX tests
        run: |
          $CC -std=gnu17 -Wall -Wextra -I include -I libs/video -o /tmp/test_texture_layout libs/video/tests/test_texture_layout.c libs/video/rsx_texture_layout.c
          /tmp/test_texture_layout
          $CC -std=gnu17 -Wall -Wextra -I include -I libs/video -o /tmp/test_rsx_primitives libs/video/tests/test_rsx_primitives.c
          /tmp/test_rsx_primitives
          $CC -std=gnu17 -Wall -Wextra -Wno-unused-parameter -I include -I libs/video -o /tmp/test_rsx_texture_offset libs/video/tests/test_rsx_texture_offset.c libs/video/rsx_dispatch.c
          /tmp/test_rsx_texture_offset

      - name: Run the Win32 compatibility layer tests
        run: |
          $CC -std=gnu17 -Wall -Wextra -I runtime/platform -o /tmp/test_win32_compat runtime/platform/tests/test_win32_compat.c runtime/platform/win32_compat.c -lpthread
          /tmp/test_win32_compat
          $CC -std=gnu17 -Wall -Wextra -o /tmp/test_guest_ptr_trap runtime/platform/tests/test_guest_ptr_trap.c
          /tmp/test_guest_ptr_trap
          $CC -std=gnu17 -Wall -Wextra -I runtime/platform -o /tmp/test_stdio_flush runtime/platform/tests/test_stdio_flush.c runtime/platform/ps3_stdio.c runtime/platform/win32_compat.c -lpthread
          /tmp/test_stdio_flush
          $CC -std=gnu17 -Wall -Wextra -o /tmp/test_dev_flash_path runtime/platform/tests/test_dev_flash_path.c runtime/platform/ps3_dev_flash.c
          /tmp/test_dev_flash_path

      - name: Run the savedata PARAM.SFO test
        run: |
          $CC -std=gnu17 -I include -o /tmp/test_savedata_param_sfo libs/system/tests/test_savedata_param_sfo.c
          /tmp/test_savedata_param_sfo

      - name: Build and run sync_stress
        run: |
          cmake -S tests/sync_stress -B build-sync-stress -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          cmake --build build-sync-stress
          ctest --test-dir build-sync-stress --output-on-failure

      - name: Run the SPU lock-line coherence tests
        run: |
          $CC -std=gnu17 -I include -I runtime/spu -o /tmp/test_spu_coherency runtime/spu/tests/test_spu_coherency.c
          /tmp/test_spu_coherency
          for t in test_spu_lockline_peer test_spu_mfc_slots; do
            $CC -std=gnu17 -I include -I runtime/spu -I runtime/platform -o /tmp/$t \
              runtime/spu/tests/$t.c \
              runtime/spu/spu_drain.c runtime/spu/spu_lockstep.c runtime/spu/spu_coherency.c \
              runtime/spu/spu_workload.c runtime/spu/spu_vm_pagemap.c runtime/spu/spu_interp.c \
              runtime/platform/win32_compat.c -lpthread -lm
            /tmp/$t
          done

