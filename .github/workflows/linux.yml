name: Linux

on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Linux x64 (clang, Debug and Release)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      CC: clang
      CXX: clang++
      CI: "1"
      VCPKG_PACKAGES: sdl3 dbus[core] vulkan-headers volk vulkan-memory-allocator
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config lld \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev \
            libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev \
            libegl1-mesa-dev libgles2-mesa-dev libgl1-mesa-dev libdrm-dev libgbm-dev \
            libibus-1.0-dev libasound2-dev libpulse-dev

      - name: vcpkg cache key
        id: vcpkg
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          rev=$(git -C "$VCPKG_INSTALLATION_ROOT" rev-parse --short HEAD)
          sig=$(printf '%s\n%s\n' "$VCPKG_PACKAGES" "$(clang --version | head -1)" | sha256sum | cut -c1-16)
          echo "key=vcpkg-x64-linux-$rev-$sig" >> "$GITHUB_OUTPUT"

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ steps.vcpkg.outputs.key }}
          restore-keys: vcpkg-x64-linux-

      - name: Install vcpkg dependencies
        run: |
          "$VCPKG_INSTALLATION_ROOT/vcpkg" install $VCPKG_PACKAGES --triplet x64-linux
          echo "CMAKE_PREFIX_PATH=$VCPKG_INSTALLATION_ROOT/installed/x64-linux" >> "$GITHUB_ENV"

      - name: Save vcpkg binary cache
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ steps.vcpkg.outputs.key }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install Python packages
        run: python -m pip install -r requirements.txt

      - name: Configure, build and test (Debug, Release)
        run: |
          for cfg in Debug Release; do
            cmake -S . -B build-$cfg -G Ninja -DCMAKE_BUILD_TYPE=$cfg -DPS3RECOMP_BUILD_TESTS=ON
            cmake --build build-$cfg
            ctest --test-dir build-$cfg --output-on-failure
          done

      - name: No Win32-only symbols in the POSIX archive
        if: ${{ !cancelled() }}
        run: |
          lib=build-Release/libps3recomp_runtime.a
          nm -g --defined-only "$lib" | awk 'NF==3 {print $3}' | sort -u > /tmp/defined.txt
          nm --undefined-only "$lib" | awk 'NF==2 {print $2}' | sort -u > /tmp/undefined.txt
          comm -23 /tmp/undefined.txt /tmp/defined.txt > /tmp/external.txt
          if grep -E '^(__imp_|_aligned_|_beginthread|_Interlocked|__security_|__chkstk|pthread_threadid_np|mach_|[A-Z][a-z0-9]+[A-Z][A-Za-z0-9]*$)' /tmp/external.txt | grep -v '^SDL_'; then
            echo "Win32/Darwin-only symbols are referenced but not defined in the POSIX build"
            exit 1
          fi

      - name: Lifter and fixture test suites
        if: ${{ !cancelled() }}
        run: |
          fail=0
          for t in tools/test_*.py; do
            echo "::group::$t"
            rc=0; out=$(python "$t" 2>&1) || rc=$?
            echo "$out"
            echo "::endgroup::"
            if [ $rc -ne 0 ]; then fail=1; echo "::error::$t failed"; fi
            skip=$(grep -m1 -E '^SKIP|"status": "SKIP"' <<<"$out") && echo "::notice::$t: $skip"
          done
          exit $fail

      - name: PPU boot scaffold ratchet
        if: ${{ !cancelled() }}
        run: python tools/check_ppu_scaffold.py --verbose

      - name: ps3_env_once
        if: ${{ !cancelled() }}
        run: |
          $CC -std=gnu17 -Wall -Werror -I include -o /tmp/test_env_once tests/test_env_once.c
          /tmp/test_env_once
          $CXX -x c++ -std=c++17 -Wall -Werror -I include -o /tmp/test_env_once_cpp tests/test_env_once.c
          /tmp/test_env_once_cpp

      - name: SPU helper, shuffle, float and integer tests
        if: ${{ !cancelled() }}
        run: |
          $CC -std=gnu17 -I include -I runtime/spu -o /tmp/test_spu_helpers runtime/spu/tests/test_spu_helpers.c -lm
          /tmp/test_spu_helpers
          $CC -std=gnu17 -I include -I runtime/spu -o /tmp/spu_xswd_test runtime/spu/tests/spu_xswd_test.c
          /tmp/spu_xswd_test
          $CC -std=gnu17 -I include -I runtime/spu -o /tmp/test_spu_numeric_semantics runtime/spu/tests/test_spu_numeric_semantics.c -lm
          /tmp/test_spu_numeric_semantics
          $CC -std=gnu17 -O2 -msse4.1 -I include -I runtime/spu -o /tmp/test_spu_shufb runtime/spu/tests/test_spu_shufb.c
          /tmp/test_spu_shufb
          $CC -std=gnu17 -O2 -msse4.1 -I include -I runtime -I runtime/spu \
            -o /tmp/test_spu_int_x86_sse41 runtime/spu/tests/test_spu_int_x86.c -lm
          /tmp/test_spu_int_x86_sse41
          grep -q avx2 /proc/cpuinfo
          $CC -std=gnu17 -O2 -march=x86-64-v3 -I include -I runtime -I runtime/spu \
            -o /tmp/test_spu_int_x86_avx2 runtime/spu/tests/test_spu_int_x86.c -lm
          /tmp/test_spu_int_x86_avx2
          $CC -std=gnu17 -O2 -mavx2 -mfma -I include -I runtime/spu \
            -o /tmp/test_spu_float_neon runtime/spu/tests/test_spu_float_neon.c -lm
          /tmp/test_spu_float_neon
          $CC -std=gnu17 -O2 -mavx2 -mfma -I include -I runtime/spu \
            -o /tmp/test_spu_float_est runtime/spu/tests/test_spu_float_est.c -lm
          /tmp/test_spu_float_est
          $CC -std=gnu17 -O2 -mavx2 -mfma -ffp-contract=off -UNDEBUG -I include -I runtime/spu \
            -o /tmp/test_spu_float_vector_scalar_avx2 runtime/spu/tests/test_spu_float_vector_scalar.c -lm
          /tmp/test_spu_float_vector_scalar_avx2 16
          /tmp/test_spu_float_vector_scalar_avx2 16 rz
          $CC -std=gnu17 -I include -I runtime/spu -c runtime/spu/tests/test_shared_header_data.c -o /tmp/shared_a.o
          $CXX -std=gnu++17 -I include -I runtime/spu -c runtime/spu/tests/test_shared_header_data_b.cpp -o /tmp/shared_b.o
          $CXX /tmp/shared_a.o /tmp/shared_b.o -o /tmp/test_shared_header_data
          /tmp/test_shared_header_data

      - name: SPU thread and group tests
        if: ${{ !cancelled() }}
        run: |
          flags="-std=gnu17 -I include -I runtime -I runtime/syscalls -I runtime/spu -I libs/video -ffunction-sections -fdata-sections -fuse-ld=lld -Wl,--gc-sections -pthread"
          $CC $flags runtime/spu/tests/test_spu_group_lifecycle.c runtime/spu/tests/test_spu_group_lifecycle_win_stubs.c libs/filesystem/ps3_vfs.c \
            runtime/spu/spu_lifted_thread.c runtime/platform/ps3_sync.c runtime/spu/tests/spu_fixture_ppu.c -o /tmp/test_spu_group_lifecycle
          /tmp/test_spu_group_lifecycle
          $CC $flags runtime/spu/tests/test_spu_thread_image_id.c runtime/spu/spu_lifted_thread.c libs/filesystem/ps3_vfs.c -o /tmp/test_spu_thread_image_id
          /tmp/test_spu_thread_image_id
          $CC $flags runtime/spu/tests/test_spu_user_event_port.c runtime/platform/ps3_sync.c libs/filesystem/ps3_vfs.c -o /tmp/test_spu_user_event_port
          /tmp/test_spu_user_event_port
          $CC $flags runtime/spu/tests/test_spu_dma_put.c runtime/spu/tests/spu_fixture_ppu.c runtime/platform/win32_compat.c \
            runtime/platform/ps3_sync.c -o /tmp/test_spu_dma_put
          /tmp/test_spu_dma_put

      - name: Network and sysutil HLE tests
        if: ${{ !cancelled() }}
        run: |
          gc="-ffunction-sections -fdata-sections -fuse-ld=lld -Wl,--gc-sections"
          $CC -std=gnu17 -I include -o /tmp/test_sys_net libs/network/tests/test_sys_net.c
          /tmp/test_sys_net
          $CC -std=gnu17 -I include -I libs/system -o /tmp/test_netctl_netstart libs/network/tests/test_netctl_netstart.c
          /tmp/test_netctl_netstart
          PS3_NET_ONLINE=1 /tmp/test_netctl_netstart
          $CC -std=gnu17 -I include -o /tmp/test_np_commerce2 libs/network/tests/test_np_commerce2.c
          /tmp/test_np_commerce2
          $CC -std=gnu17 -I include -o /tmp/test_savedata_param_sfo libs/system/tests/test_savedata_param_sfo.c
          /tmp/test_savedata_param_sfo
          $CC -std=gnu17 -I include $gc -o /tmp/test_savedata_root libs/system/tests/test_savedata_root.c
          /tmp/test_savedata_root
          for t in test_dialog_callbacks test_license_area; do
            $CC -std=gnu17 -I include $gc libs/system/tests/$t.c libs/system/cellSysutil.c -pthread -o /tmp/$t
            /tmp/$t
          done

      - name: RSX tests
        if: ${{ !cancelled() }}
        run: |
          $CC -std=gnu17 -O2 -I libs/video -I include libs/video/tests/test_rsx_spirv.c libs/video/rsx_spirv.c -o /tmp/test_rsx_spirv
          /tmp/test_rsx_spirv
          $CXX -std=c++20 -O2 -I "$CMAKE_PREFIX_PATH/include" -I include -I libs/video -I libs/video/vk \
            libs/video/vk/tests/test_rsx_texture.cpp libs/video/vk/rsx_texture.cpp -o /tmp/test_rsx_texture
          /tmp/test_rsx_texture

      - name: Win32 compatibility layer tests
        if: ${{ !cancelled() }}
        run: |
          $CC -std=gnu17 -Wall -Wextra -I runtime/platform -o /tmp/test_win32_compat runtime/platform/tests/test_win32_compat.c runtime/platform/win32_compat.c -lpthread
          /tmp/test_win32_compat
          $CC -std=gnu17 -Wall -Wextra -o /tmp/test_guest_ptr_trap runtime/platform/tests/test_guest_ptr_trap.c
          /tmp/test_guest_ptr_trap
          $CC -std=gnu17 -Wall -Wextra -I runtime/platform -o /tmp/test_stdio_flush runtime/platform/tests/test_stdio_flush.c runtime/platform/ps3_stdio.c runtime/platform/win32_compat.c -lpthread
          /tmp/test_stdio_flush
          $CC -std=gnu17 -Wall -Wextra -o /tmp/test_dev_flash_path runtime/platform/tests/test_dev_flash_path.c runtime/platform/ps3_dev_flash.c
          /tmp/test_dev_flash_path
