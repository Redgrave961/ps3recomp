name: Windows

on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Windows x64 (${{ matrix.build_type }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Install Ninja
        run: choco install ninja -y --no-progress

      - name: Install dependencies
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg" install sdl3 vulkan-headers volk vulkan-memory-allocator --triplet x64-windows-static-md
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_C_COMPILER=clang-cl
          -DCMAKE_CXX_COMPILER=clang-cl
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_PREFIX_PATH="$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows-static-md"

      - name: Build
        run: cmake --build build

      - name: Verify the library exists
        shell: bash
        run: test -s build/ps3recomp_runtime.lib

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Run the lifter test suites
        shell: bash
        env:
          CI: "1"
        run: |
          set -e
          for t in tools/test_*.py; do
            echo "--- $t"
            python "$t"
          done

      - name: Check the PPU boot scaffold (ratchet)
        run: python tools/check_ppu_scaffold.py

      - name: Run the ps3_env_once test (cl and clang-cl)
        run: |
          cl /nologo /W3 /WX /D_CRT_SECURE_NO_WARNINGS /I include /Fe:test_env_once_cl.exe tests/test_env_once.c
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .\test_env_once_cl.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cl /nologo /W3 /WX /TP /D_CRT_SECURE_NO_WARNINGS /I include /Fe:test_env_once_cl_cpp.exe tests/test_env_once.c
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .\test_env_once_cl_cpp.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }
          clang-cl /nologo /W3 /WX /D_CRT_SECURE_NO_WARNINGS /I include /Fe:test_env_once_clang.exe tests/test_env_once.c
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .\test_env_once_clang.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Run self-contained SPU helper tests
        run: |
          clang-cl /nologo /W0 /D_CRT_SECURE_NO_WARNINGS /I include /I runtime/spu /Fe:test_spu_helpers.exe runtime/spu/tests/test_spu_helpers.c
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .\test_spu_helpers.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Run the sys_net loopback test
        run: |
          clang-cl /nologo /W0 /D_CRT_SECURE_NO_WARNINGS /I include /Fe:test_sys_net.exe libs/network/tests/test_sys_net.c ws2_32.lib
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .\test_sys_net.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Run self-contained RSX tests
        run: |
          clang-cl /nologo /W0 /D_CRT_SECURE_NO_WARNINGS /I include /I libs/video /Fe:test_texture_layout.exe libs/video/tests/test_texture_layout.c libs/video/rsx_texture_layout.c
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .\test_texture_layout.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }
          clang-cl /nologo /W0 /D_CRT_SECURE_NO_WARNINGS /I include /I libs/video /Fe:test_rsx_primitives.exe libs/video/tests/test_rsx_primitives.c
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .\test_rsx_primitives.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Build and run sync_stress
        run: |
          cmake -S tests/sync_stress -B build-sync-stress -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DCMAKE_C_COMPILER=clang-cl
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cmake --build build-sync-stress
          if ($LASTEXITCODE -ne 0) { exit 1 }
          ctest --test-dir build-sync-stress --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit 1 }
